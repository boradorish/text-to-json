### arguments: https://llamafactory.readthedocs.io/en/latest/advanced/arguments.html

### model
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
disable_shuffling: false
finetuning_type: full
# deepspeed: ../LLaMA-Factory/examples/deepspeed/ds_z2_config.json

### dataset
dataset_dir: ../LLaMA-Factory/data
dataset: sunny_reasoning
template: qwen
cutoff_len: 8192
max_samples: 50000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen2.5-3b-instruct/full/sft
logging_steps: 1
save_steps: 92
save_total_limit: 9
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 4.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
optim: adamw_torch_fused

### acceleration
flash_attn: sdpa
enable_liger_kernel: false
disable_gradient_checkpointing: false

### eval
# eval_dataset: alpaca_en_demo
val_size: 0.05
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500
