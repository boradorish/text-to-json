### Merge Qwen3-4B ScrapeGraph LoRA adapter into a full HF model.
#
# Run:
#   llamafactory-cli export src/train/export_qwen3_4B_scrapegraph_merged.yaml

### model
model_name_or_path: Qwen/Qwen3-4B
adapter_name_or_path: saves/qwen3-4b/lora/scrapegraph_sft
trust_remote_code: true

### method
finetuning_type: lora
template: qwen3_nothink

### export
export_dir: saves/qwen3-4b/merged/scrapegraph_sft
export_size: 5
export_device: cuda
export_legacy_format: false
